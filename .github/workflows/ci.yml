name: ci
on:
  pull_request:
  push:
    branches: [qa, main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: repetition
          POSTGRES_PASSWORD: repetition
          POSTGRES_DB: repetition
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repetition -d repetition"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://repetition:repetition@localhost:5432/repetition?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: make migrate
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: go test -race ./...
