        reason: {type: string}
    CourseHours:
      type: object
      required: [subject_id, name, hours_used, hours_budget, reason]
      properties:
        subject_id: {type: string}
        name: {type: string}
        hours_used: {type: number}
        hours_budget: {type: number}
        reason: {type: string, description: "Empty unless the budget changed, e.g. \"Up 1.5 h: 3 gaps on Monday\""}
    TodayCourse:
      type: object
      required: [subject_id, name, minutes, items]
      properties:
        subject_id: {type: string}
        name: {type: string}
        minutes: {type: integer}
        items: {type: array, items: {$ref: "#/components/schemas/TodayItem"}}
    Today:
      type: object
      required: [date, courses, study_time]
      properties:
        date: {type: string, format: date-time, description: "Start of the user's local day"}
        courses: {type: array, items: {$ref: "#/components/schemas/TodayCourse"}}
        study_time: {type: array, items: {$ref: "#/components/schemas/CourseHours"}}
    WeekDay:
      type: object
