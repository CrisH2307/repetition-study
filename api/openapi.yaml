        id: {type: string}
        session_id: {type: string}
        claim_id: {type: string, nullable: true}
        user_id: {type: string}
        note: {type: string}
        status: {$ref: "#/components/schemas/DisputeStatus"}
        created_at: {type: string, format: date-time}
    TodayKind: {type: string, enum: [teach, recall]}
