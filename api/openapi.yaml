openapi: 3.0.3
info:
  title: Space Repetition API
  version: 0.3.0
  description: >
    The contract every unit builds against. Schemas mirror internal/domain.
    Sign-in is by invite link (D29): redeeming sets an HttpOnly `session` cookie.
    Every /v1 path except /v1/auth/redeem needs that cookie and acts only on the
    signed-in user's rows; another user's id gives 404, a missing session 401.
    Times are RFC 3339 UTC. IDs are UUID strings. Errors are {"error": "..."} in plain words.
security:
  - session: []
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string, example: ok}}}
  /v1/subjects:
    get:
      summary: List subjects
      responses:
        "200": {description: Subjects, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Subject"}}}}}
    post:
      summary: Add a subject
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SubjectCreate"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Subject"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /v1/plan/generate:
    post:
      summary: Generate the weekly plan, replacing unlocked blocks
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [week_start], properties: {week_start: {type: string, format: date}}}}}
      responses:
        "200": {description: The plan, content: {application/json: {schema: {$ref: "#/components/schemas/Plan"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /v1/plan:
    get:
      summary: Get the plan for a week
      parameters:
        - {name: week, in: query, required: true, description: Monday of the week, schema: {type: string, format: date}}
      responses:
        "200": {description: The plan, content: {application/json: {schema: {$ref: "#/components/schemas/Plan"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /v1/plan/blocks/{id}:
    patch:
      summary: Edit a block (move it, resize it, lock it)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                starts_at: {type: string, format: date-time}
                minutes: {type: integer, minimum: 1}
                locked: {type: boolean}
      responses:
        "200": {description: Updated block, content: {application/json: {schema: {$ref: "#/components/schemas/PlanBlock"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/teach/sessions:
    post:
      summary: Start a teach-back session on a concept
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [concept_id], properties: {concept_id: {type: string}}}}}
      responses:
        "201": {description: Session, content: {application/json: {schema: {$ref: "#/components/schemas/TeachSession"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/teach/sessions/{id}/turns:
    post:
      summary: Send one turn. The AI student replies with one question, streamed.
      description: >
        Response is text/event-stream. Events: `token` (data {"text": "..."}),
        `done` (data {}), `error` (data {"error": "..."}). Transcript and latex are untrusted data.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transcript]
              properties:
                transcript: {type: string}
                latex: {type: string}
      responses:
        "200": {description: Server-sent events, content: {text/event-stream: {schema: {type: string}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/teach/sessions/{id}/finish:
    post:
      summary: End the session. Runs the checker and updates the schedule.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Report, content: {application/json: {schema: {$ref: "#/components/schemas/Report"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/teach/sessions/{id}/report:
    get:
      summary: Get the cited report after the attempt
      description: >
        status is unchecked when the checker failed. Then schedule is null and no review date moved.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Report, content: {application/json: {schema: {$ref: "#/components/schemas/Report"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/reviews/due:
    get:
      summary: Concepts and cards due now
      responses:
        "200": {description: Due items, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/DueItem"}}}}}
  /v1/cards/{id}/review:
    post:
      summary: Grade a card review
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [grade], properties: {grade: {$ref: "#/components/schemas/Grade"}}}}}
      responses:
        "200": {description: The appended event, content: {application/json: {schema: {$ref: "#/components/schemas/ReviewEvent"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/cards/{id}:
    patch:
      summary: Edit a card
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {front: {type: string}, back: {type: string}}}}}
      responses:
        "200": {description: Updated card, content: {application/json: {schema: {$ref: "#/components/schemas/Card"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/concepts/{id}/override:
    post:
      summary: Move a concept's next review date by hand
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [due_at, reason], properties: {due_at: {type: string, format: date-time}, reason: {type: string}}}}}
      responses:
        "200": {description: The appended manual_override event, content: {application/json: {schema: {$ref: "#/components/schemas/ReviewEvent"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/analytics/further-planning:
    get:
      summary: Recall and explanation per concept, with next week's hours
      parameters:
        - {name: week, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200": {description: Progress, content: {application/json: {schema: {$ref: "#/components/schemas/FurtherPlanning"}}}}
  /v1/digest/today:
    get:
      summary: Today's digest, one line per subject
      responses:
        "200": {description: Digest, content: {application/json: {schema: {$ref: "#/components/schemas/Digest"}}}}
  /v1/auth/redeem:
    post:
      summary: Open an invite link. Creates the user on first use and signs in.
      description: Sets the HttpOnly `session` cookie (30 days). Needs no cookie.
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [token], properties: {token: {type: string}}}}}
      responses:
        "200": {description: Signed in, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/auth/sign-out:
    post:
      summary: Sign out. Deletes the session and clears the cookie.
      responses:
        "204": {description: Signed out}
  /v1/me:
    get:
      summary: The signed-in user
      responses:
        "200": {description: User, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        "401": {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete my account and everything in it, review history included (D43). Cannot be undone.
      description: Also signs out. The body must confirm, so a stray request deletes nothing.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [confirm], properties: {confirm: {type: string, enum: [delete my account]}}}}}
      responses:
        "204": {description: Deleted}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /v1/me/export:
    get:
      summary: Download my data as one JSON file (D37)
      responses:
        "200": {description: Everything I wrote and every schedule change, content: {application/json: {schema: {$ref: "#/components/schemas/UserExport"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v1/consent:
    post:
      summary: Record that I accepted this version of the consent text (D44). Repeating it changes nothing.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [text_version], properties: {text_version: {type: string, minLength: 1}}}}}
      responses:
        "201": {description: Recorded, content: {application/json: {schema: {$ref: "#/components/schemas/Consent"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /v1/feedback:
    get:
      summary: This week's question and my answer, if any (D40)
      responses:
        "200": {description: Question, content: {application/json: {schema: {$ref: "#/components/schemas/FeedbackPrompt"}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      summary: Answer this week's question. A second answer replaces the first.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [answer], properties: {answer: {type: string, minLength: 1}}}}}
      responses:
        "201": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/FeedbackAnswer"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /v1/courses/{id}/import:
    post:
      summary: Import concepts and claims from a CSV (concept, claim, kind, quote). Each quote must be on a Ready page (D38).
      description: The first line is the header. Poll the import until status is not running.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: A CSV file}
      responses:
        "202": {description: "Stored, status running", content: {application/json: {schema: {$ref: "#/components/schemas/ImportJob"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/imports/{id}:
    get:
      summary: An import with counts and the rows it refused
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Import, content: {application/json: {schema: {$ref: "#/components/schemas/ImportJob"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/courses/{id}/share:
    post:
      summary: Make a share link for my course. It carries concept names and claim text only, never quotes or notes (D50).
      description: include_sources adds my Ready notes and is allowed for instructors only (D51), else 400. The token is shown once.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {include_sources: {type: boolean, default: false}}}}}
      responses:
        "201": {description: Link made, content: {application/json: {schema: {$ref: "#/components/schemas/NewShare"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/shares/{id}:
    delete:
      summary: Turn off a share link. The link then gives 404.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Revoked}
        "404": {$ref: "#/components/responses/Error"}
  /v1/shared/{token}:
    get:
      summary: What a share link holds (D50). No sign-in.
      security: []
      parameters: [{$ref: "#/components/parameters/Token"}]
      responses:
        "200": {description: Pack, content: {application/json: {schema: {$ref: "#/components/schemas/PackPreview"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/shared/{token}/import:
    post:
      summary: Add a shared pack to my course. Each claim needs a quote from my own Ready notes (or the copied instructor notes); the rest come back in needs_quote.
      parameters: [{$ref: "#/components/parameters/Token"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [subject_id], properties: {subject_id: {type: string}}}}}
      responses:
        "200": {description: Imported, content: {application/json: {schema: {$ref: "#/components/schemas/PackImport"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/courses:
    get:
      summary: List my courses
      responses:
        "200": {description: Courses, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Subject"}}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      summary: Add a course
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SubjectCreate"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Subject"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /v1/courses/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    get:
      summary: Get a course
      responses:
        "200": {description: Course, content: {application/json: {schema: {$ref: "#/components/schemas/Subject"}}}}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      summary: Edit a course
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SubjectCreate"}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Subject"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      summary: Archive a course. It is hidden; its history stays.
      responses:
        "204": {description: Archived}
        "404": {$ref: "#/components/responses/Error"}
  /v1/courses/{id}/view:
    get:
      summary: Course screen. Notes with status, study cards, Mistakes.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Course view, content: {application/json: {schema: {$ref: "#/components/schemas/CourseView"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/courses/{id}/concepts:
    post:
      summary: Add a concept to a course
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1}}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Concept"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/courses/{id}/blocks:
    get:
      summary: Blocks from Ready pages. The only text a claim or correction can quote.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Blocks, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/SourceBlock"}}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/courses/{id}/uploads:
    parameters: [{$ref: "#/components/parameters/Id"}]
    get:
      summary: List the course's uploads with status
      responses:
        "200": {description: Uploads, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Upload"}}}}}
        "404": {$ref: "#/components/responses/Error"}
    post:
      summary: Upload a PDF (at most 20 MB) or paste text. Reading runs in the background.
      description: Send either `file` or `text`, not both. Poll the upload until status is not reading.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [filename]
              properties:
                filename: {type: string}
                file: {type: string, format: binary, description: A PDF}
                text: {type: string, description: "Pasted notes, read as one page"}
      responses:
        "202": {description: "Stored, status reading", content: {application/json: {schema: {$ref: "#/components/schemas/Upload"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/uploads/{id}:
    get:
      summary: Get an upload and its status
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Upload, content: {application/json: {schema: {$ref: "#/components/schemas/Upload"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/uploads/{id}/pages:
    get:
      summary: List an upload's pages in order
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Pages, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Page"}}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/pages/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    get:
      summary: Get a page
      responses:
        "200": {description: Page, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      summary: Save the checked text of a page
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [edited_text], properties: {edited_text: {type: string}}}}}
      responses:
        "200": {description: Page, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/pages/{id}/image:
    get:
      summary: The page as a PNG
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: PNG, content: {image/png: {schema: {type: string, format: binary}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/pages/{id}/ready:
    post:
      summary: Mark the page Ready. Its checked text becomes quotable source blocks.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Page, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/pages/{id}/unready:
    post:
      summary: Mark the page as needing checks again. Removes its blocks.
      description: Refused (400) while a claim quotes this page.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Page, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/concepts/{id}/claims:
    parameters: [{$ref: "#/components/parameters/Id"}]
    get:
      summary: The concept's claim checklist
      responses:
        "200": {description: Claims, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Claim"}}}}}
        "404": {$ref: "#/components/responses/Error"}
    post:
      summary: Add a claim anchored to an exact quote from a Ready page
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ClaimInput"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Claim"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/claims/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    patch:
      summary: Edit a claim. The anchor is checked again.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ClaimInput"}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Claim"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      summary: Remove a claim from the checklist. Past reports keep it.
      responses:
        "204": {description: Removed}
        "404": {$ref: "#/components/responses/Error"}
  /v1/teach/sessions/{id}/self-grades:
    post:
      summary: Save how the student feels per claim. Changes no review date.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grades]
              properties:
                grades:
                  type: array
                  items: {type: object, required: [claim_id, rating], properties: {claim_id: {type: string}, rating: {$ref: "#/components/schemas/SelfRating"}}}
      responses:
        "204": {description: Saved}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/teach/sessions/{id}/disputes:
    post:
      summary: "\"I think this check is wrong.\" Saved for a person to read. The date stays as shown."
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {claim_id: {type: string, nullable: true}, note: {type: string}}}}}
      responses:
        "201": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/Dispute"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/today:
    get:
      summary: Today queue per course, with minutes and Study Time
      responses:
        "200": {description: Today, content: {application/json: {schema: {$ref: "#/components/schemas/Today"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /v1/week:
    get:
      summary: Week plan. Hours per course, day by day items, notes.
      parameters:
        - {name: week, in: query, required: true, description: Monday of the week, schema: {type: string, format: date}}
      responses:
        "200": {description: Week plan, content: {application/json: {schema: {$ref: "#/components/schemas/WeekPlan"}}}}
        "400": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: session}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
    Token: {name: token, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: Error
      content: {application/json: {schema: {type: object, required: [error], properties: {error: {type: string}}}}}
  schemas:
    ClaimLabel: {type: string, enum: [supported, partial, contradicted, absent]}
    Grade: {type: string, enum: [again, hard, good, easy]}
    EventType: {type: string, enum: [card_review, teach_back, manual_override]}
    SourceKind: {type: string, enum: [course, allowlist]}
    Level: {type: string, enum: [beginner, intermediate, advanced]}
    PlanKind: {type: string, enum: [review, teach, new]}
    ReportStatus: {type: string, enum: [checked, unchecked]}
    Source:
      type: object
      required: [id, kind, title, text]
      properties:
        id: {type: string}
        kind: {$ref: "#/components/schemas/SourceKind"}
        title: {type: string}
        url: {type: string}
        publisher: {type: string}
        license: {type: string}
        reviewed_by: {type: string}
        reviewed_at: {type: string, format: date-time}
        text: {type: string}
    SubjectCreate:
      type: object
      required: [name, weekly_hours, level]
      properties:
        name: {type: string}
        weekly_hours: {type: number, minimum: 0}
        level: {$ref: "#/components/schemas/Level"}
        exam_date: {type: string, format: date}
        weight: {type: number, minimum: 0, default: 1}
    Subject:
      allOf:
        - $ref: "#/components/schemas/SubjectCreate"
        - {type: object, required: [id, weight], properties: {id: {type: string}}}
    Claim:
      type: object
      required: [id, concept_id, text, source_id, locator, required]
      properties:
        id: {type: string}
        concept_id: {type: string}
        text: {type: string}
        source_id: {type: string}
        locator: {type: string}
        required: {type: boolean}
        kind: {$ref: "#/components/schemas/ClaimKind"}
        author_user_id: {type: string}
        anchor: {$ref: "#/components/schemas/Anchor"}
    Concept:
      type: object
      required: [id, subject_id, name, claims]
      properties:
        id: {type: string}
        subject_id: {type: string}
        name: {type: string}
        claims: {type: array, items: {$ref: "#/components/schemas/Claim"}}
    Citation:
      type: object
      required: [source_id, quote, locator]
      properties:
        source_id: {type: string}
        quote: {type: string, description: "Exact substring of the approved source text, verified by code"}
        locator: {type: string}
    ClaimResult:
      type: object
      required: [claim_id, student_text, label, citation, correction, probe_hint]
      properties:
        claim_id: {type: string, nullable: true}
        student_text: {type: string}
        label: {$ref: "#/components/schemas/ClaimLabel"}
        citation: {allOf: [{$ref: "#/components/schemas/Citation"}], nullable: true}
        correction: {type: string, nullable: true, description: Present only with a valid citation}
        probe_hint: {type: string, nullable: true, description: Never contains source text}
    ReviewEvent:
      type: object
      required: [id, event_type, concept_id, card_id, grade, due_before, due_after, stability_before, stability_after, payload, created_at, session_id, claim_id, self_grade, checker_model, checker_version]
      properties:
        id: {type: string}
        event_type: {$ref: "#/components/schemas/EventType"}
        concept_id: {type: string}
        card_id: {type: string, nullable: true}
        grade: {allOf: [{$ref: "#/components/schemas/Grade"}], nullable: true}
        due_before: {type: string, format: date-time}
        due_after: {type: string, format: date-time}
        stability_before: {type: number}
        stability_after: {type: number}
        payload: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
        session_id: {type: string, nullable: true, description: Set on teach_back. One session writes one teach_back event}
        claim_id: {type: string, nullable: true}
        self_grade: {allOf: [{$ref: "#/components/schemas/Grade"}], nullable: true}
        checker_model: {type: string, nullable: true}
        checker_version: {type: string, nullable: true}
    PlanBlock:
      type: object
      required: [id, subject_id, concept_id, kind, starts_at, minutes, reason, locked]
      properties:
        id: {type: string}
        subject_id: {type: string}
        concept_id: {type: string, nullable: true}
        kind: {$ref: "#/components/schemas/PlanKind"}
        starts_at: {type: string, format: date-time}
        minutes: {type: integer}
        reason: {type: string}
        locked: {type: boolean}
    Plan:
      type: object
      required: [week_start, blocks]
      properties:
        week_start: {type: string, format: date-time}
        blocks: {type: array, items: {$ref: "#/components/schemas/PlanBlock"}}
    Card:
      type: object
      required: [id, concept_id, claim_id, front, back]
      properties:
        id: {type: string}
        concept_id: {type: string}
        claim_id: {type: string, nullable: true}
        front: {type: string}
        back: {type: string}
    DueItem:
      type: object
      required: [concept_id, concept_name, card_id, card, due_at, reason]
      properties:
        concept_id: {type: string}
        concept_name: {type: string}
        card_id: {type: string, nullable: true}
        card: {allOf: [{$ref: "#/components/schemas/Card"}], nullable: true}
        due_at: {type: string, format: date-time}
        reason: {type: string, description: "Why the item is due, in plain words"}
    TeachSession:
      type: object
      required: [id, concept_id]
      properties:
        id: {type: string}
        concept_id: {type: string}
    Report:
      type: object
      required: [session_id, concept_id, results, schedule, status]
      properties:
        session_id: {type: string}
        concept_id: {type: string}
        results: {type: array, items: {$ref: "#/components/schemas/ClaimResult"}}
        schedule: {allOf: [{$ref: "#/components/schemas/ReviewEvent"}], nullable: true, description: "The teach_back event, so the date change is visible"}
        status: {$ref: "#/components/schemas/ReportStatus"}
    ConceptProgress:
      type: object
      required: [concept_id, name, recall, explanation, next_due]
      properties:
        concept_id: {type: string}
        name: {type: string}
        recall: {type: number, nullable: true, description: "0 to 1, from card reviews"}
        explanation: {type: number, nullable: true, description: "0 to 1, from teach-backs"}
        next_due: {type: string, format: date-time, nullable: true}
    SubjectProgress:
      type: object
      required: [subject_id, name, concepts, next_week_hours]
      properties:
        subject_id: {type: string}
        name: {type: string}
        concepts: {type: array, items: {$ref: "#/components/schemas/ConceptProgress"}}
        next_week_hours: {type: number}
    FurtherPlanning:
      type: object
      required: [week_start, subjects]
      properties:
        week_start: {type: string, format: date-time}
        subjects: {type: array, items: {$ref: "#/components/schemas/SubjectProgress"}}
    Digest:
      type: object
      required: [date, items]
      properties:
        date: {type: string, format: date-time}
        items:
          type: array
          items:
            type: object
            required: [subject_id, subject_name, due_count, minutes]
            properties:
              subject_id: {type: string}
              subject_name: {type: string}
              due_count: {type: integer}
              minutes: {type: integer}
    User:
      type: object
      required: [id, name, time_zone]
      properties:
        id: {type: string}
        name: {type: string}
        time_zone: {type: string, description: IANA zone name}
        consent_version: {type: string, nullable: true, description: "Only on GET /v1/me. Latest consent text version I accepted, or null (D44)."}
        is_instructor: {type: boolean, description: "Set by Cris only (D51)."}
    UploadStatus: {type: string, enum: [reading, needs_checking, ready]}
    PageStatus: {type: string, enum: [needs_checking, ready]}
    BlockKind: {type: string, enum: [text, math, heading, figure]}
    Upload:
      type: object
      required: [id, subject_id, filename, status, error, source_id, pages_total, pages_ready, created_at]
      properties:
        id: {type: string}
        subject_id: {type: string}
        filename: {type: string}
        status: {$ref: "#/components/schemas/UploadStatus"}
        error: {type: string, description: "Plain words when reading failed, else empty"}
        source_id: {type: string, nullable: true, description: The course source Ready pages feed}
        pages_total: {type: integer}
        pages_ready: {type: integer}
        created_at: {type: string, format: date-time}
    Page:
      type: object
      required: [id, upload_id, number, raw_text, edited_text, status, has_image, updated_at]
      properties:
        id: {type: string}
        upload_id: {type: string}
        number: {type: integer, minimum: 1}
        raw_text: {type: string}
        edited_text: {type: string}
        status: {$ref: "#/components/schemas/PageStatus"}
        has_image: {type: boolean}
        updated_at: {type: string, format: date-time}
    SourceBlock:
      type: object
      required: [id, source_id, page, ordinal, kind, text_md, text_norm]
      properties:
        id: {type: string}
        source_id: {type: string}
        page: {type: integer, nullable: true}
        ordinal: {type: integer}
        kind: {$ref: "#/components/schemas/BlockKind"}
        text_md: {type: string}
        text_norm: {type: string}
        verified_by: {type: string}
        verified_at: {type: string, format: date-time}
    ClaimKind: {type: string, enum: [definition, statement, condition, method]}
    Anchor:
      type: object
      required: [block_id, quote]
      properties:
        block_id: {type: string}
        quote: {type: string, description: "Exact text from a Ready block, verified by internal/cite"}
    ClaimInput:
      type: object
      required: [text, kind, required, anchor]
      properties:
        text: {type: string, minLength: 1}
        kind: {$ref: "#/components/schemas/ClaimKind"}
        required: {type: boolean}
        anchor: {$ref: "#/components/schemas/Anchor"}
