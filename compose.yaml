services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repetition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repetition}
      POSTGRES_DB: ${POSTGRES_DB:-repetition}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
  app:
    profiles: ["prod"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-repetition}:${POSTGRES_PASSWORD:-repetition}@db:5432/${POSTGRES_DB:-repetition}?sslmode=disable
      STUDENT_MODEL: ${STUDENT_MODEL:-}
      CHECKER_MODEL: ${CHECKER_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: ["sh", "-c", "migrate && exec api"]
    ports:
      - "${PORT:-8080}:8080"
volumes:
  pgdata:
