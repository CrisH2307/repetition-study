services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repetition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repetition}
      POSTGRES_DB: ${POSTGRES_DB:-repetition}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
