# Fly.io config for the API image (Dockerfile). App name is a default; change it if taken.
app = "space-repetition-api"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "migrate"

[env]
  PORT = "8080"
  COOKIE_SECURE = "true"
  # APP_URL, DATABASE_URL, OPENROUTER_API_KEY etc. are set with `fly secrets set` (never in git).

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1   # always on: live streams and background PDF reading. Cost unverified.

  [[http_service.checks]]
    path = "/healthz"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
