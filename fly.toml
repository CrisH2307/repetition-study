# fly.toml app configuration file generated for repetition-study on 2026-11-17T02:49:30Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'repetition-study'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'migrate'

[env]
  COOKIE_SECURE = 'true'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
