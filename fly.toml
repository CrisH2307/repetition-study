# Fly.io config for the API image (Dockerfile). Small and cheap on purpose: the machine
# sleeps when idle and wakes on the first request (first load can be slow).
app = "repetition-study"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "migrate"

[env]
  PORT = "8080"
  COOKIE_SECURE = "true"
  # DATABASE_URL, APP_URL, OPENROUTER_API_KEY etc. are set with `fly secrets set` (never in git).

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0   # sleeps when idle. Set to 1 later if live streams or PDF reading get cut off.

  [[http_service.checks]]
    path = "/healthz"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"   # smallest size that should hold the API plus poppler for PDFs (unverified)
